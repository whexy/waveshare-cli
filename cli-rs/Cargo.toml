[package]
name = "epaper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
libc = "0.2.189"
nix = { version = "0.31.3", features = ["term", "fs", "process", "signal", "poll"] }
serialport = "4.6"

[dev-dependencies]
image = "0.25"
serde_json = "1.0.151"
temp-env = "0.3.6"
