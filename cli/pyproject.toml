[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epaper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "Pillow>=10"]

[project.scripts]
epaper = "epaper.__main__:main"

[tool.setuptools.packages.find]
include = ["epaper*"]
